<!DOCTYPE html>
<html lang="en">



<head>

<link rel="icon" href="assets/images/jw-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/images/jw-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>

    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="css/main.css">

</head>




<body>
    <header class="header">

        <div class="header-left">

    <img src="assets/images/JW-Metal-Cabinets-Logo.png"

    alt="Description"
    class="logo">



    <nav class="nav-bar">
    <a href="index.html" class="nav-link active">Inventory</a>
    <a href="reporting.html" class="nav-link">Reporting</a>    
    <a href="accessories.html" class="nav-link">Accessories</a>
    <a href="help.html" class="nav-link">Help</a>

</nav>

   

</div>

    </header>







    <div class = "container">


<div class="controls">

<div class="column-toggle">
    <label>
        <input type="radio" name="viewMode" value="basic">
        Basic View
    </label>

    <label>
        <input type="radio" name="viewMode" value="full" checked>
        Full View
    </label>
</div>

  <div class="snapshot-info">
    Last snapshot: Loading...
</div>

</div>



<div class ="inv-table">
    <table id = 'inventoryTable' data-page-length="100">


     
<thead>
    <tr>
        <th>BAY</th>
        <th>LVL</th>
        <th>BIN</th>
        <th>Part Number</th>
        <th>WIDTH</th>
        <th>DEPTH</th>
        <th>HEIGHT</th>
        <th>LOCATION</th>

        <th title="Floor Inventory (-)
Quantity of parts currently on-hand in a bin">
            ON HAND (-)
        </th>

        <th title="DXF Adjust
Quantity of parts adjusted through the DXF process">
            DXF ADJUST
        </th>

        <th title="Laser Queue (-)
Quantity of parts nested & sent to Laser
Counts Toward Inventory">
            LASER (-)
        </th>

        <th title="Shortage/Surplus
Positive/Red = Short that Amount
Negative/Green = Overstocked that Amount
Negative/Yellow = Laser Queue fulfills current orders">
            QTY SHORT
        </th>

        <th title="30 Day Sales Forecast
Qty of parts predicted to be used over the next 30 days of jobs
Number calculated directly from sales data">
            30 DAY<br>FORECAST (+)
        </th>

        <th>BARCODE</th>

        <th>SEARCH TAGS</th>

    </tr>
</thead>


    <tbody id="inventoryBody">
    </tbody>


</table>



</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.8/js/dataTables.min.js"></script>
<script src="assets/js/app.js"></script>




</div>


</body>
</html>
