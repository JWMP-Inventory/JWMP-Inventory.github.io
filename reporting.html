<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reporting</title>

    <link rel="stylesheet" href="css/main.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header class="header">

    <div class="header-left">

        <img src="assets/images/JW-Metal-Cabinets-Logo.png"
             alt="Description"
             class="logo">

        <nav class="nav-bar">

            <a href="index.html" class="nav-link">
                Inventory
            </a>

            <a href="reporting.html" class="nav-link active">
                Reporting
            </a>

            <a href="help.html" class="nav-link">
                Help
            </a>

        </nav>

    </div>

</header>


<div class="reporting-container">

    <h1>Inventory Reporting</h1>

    <p class="reporting-intro">
        Current inventory health and parts requiring attention.
    </p>


    <!-- =========================
         INVENTORY HEALTH
    ========================= -->

    <div class="reporting-card">

        <h2>Inventory Health</h2>

        <p>
            Number of parts currently classified as good, low, or critical.
        </p>

        <div class="chart-container">
            <canvas id="inventoryHealthChart"></canvas>
        </div>

    </div>


    <!-- =========================
         TOP CRITICAL PARTS
    ========================= -->

    <div class="reporting-card">

        <h2>Top Critical Parts</h2>

        <p>
            Parts with the largest current quantity shortages.
        </p>

        <div class="chart-container top-parts-chart">
            <canvas id="topCriticalChart"></canvas>
        </div>

    </div>

</div>


<script src="assets/js/reporting.js"></script>

</body>
</html>
